<title>__TITLE__</title>
<style>
  :root {
    --ground: #f4f5f7; --panel: rgba(255,255,255,.92); --panel-solid: #ffffff; --ink: #1b2129; --ink-2: #48525e; --muted: #6b7581;
    --rule: #d5d9de; --hover: rgba(27,33,41,.06);
    --accent: #2c9a55; --accent-ink: #1f7a42; --accent-soft: rgba(44,154,85,.14);
    --added: #1f7a42; --modified: #a06a08; --removed: #c0392b;
    --added-soft: rgba(44,154,85,.14); --modified-soft: rgba(185,118,12,.14); --removed-soft: rgba(248,81,73,.14); --neutral-soft: rgba(110,118,129,.14);
    --focus: #2c6fd1; --stage-bg: #f4f5f7;
    --display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0d1117; --panel: rgba(22,27,34,.9); --panel-solid: #161b22; --ink: #e4e9ef; --ink-2: #b4bcc6; --muted: #8a94a0;
      --rule: #2a313b; --hover: rgba(228,233,239,.07);
      --accent: #3fb950; --accent-ink: #5fd170; --accent-soft: rgba(63,185,80,.16);
      --added: #3fb950; --modified: #d29922; --removed: #f85149;
      --focus: #5b9cf0; --stage-bg: #0d1117;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0d1117; --panel: rgba(22,27,34,.9); --panel-solid: #161b22; --ink: #e4e9ef; --ink-2: #b4bcc6; --muted: #8a94a0;
    --rule: #2a313b; --hover: rgba(228,233,239,.07);
    --accent: #3fb950; --accent-ink: #5fd170; --accent-soft: rgba(63,185,80,.16);
    --added: #3fb950; --modified: #d29922; --removed: #f85149;
    --focus: #5b9cf0; --stage-bg: #0d1117;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  p { margin: 0; }
  code { font-family: var(--mono); font-size: .92em; }

  /* The canvas is the page. Everything else floats on it. */
  .wrap { position: fixed; inset: 0; }
  .stage { position: absolute; inset: 0; touch-action: none; cursor: grab; background: var(--stage-bg); }
  .stage.dragging { cursor: grabbing; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .float { position: absolute; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .titlecard { top: 16px; left: 16px; padding: 12px 16px 11px; max-width: min(560px, calc(100vw - 32px)); display: grid; gap: 4px; z-index: 2; }
  .titlecard.compact .crumb, .titlecard.compact .stats { display: none; }
  .titlecard.compact { padding: 10px 16px; }
  .titlecard h1 { font-family: var(--display); font-size: 17px; line-height: 1.25; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .titlecard .crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
  .titlecard .crumb b { color: var(--ink-2); font-weight: 500; }
  .titlecard .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .stat { display: inline-flex; align-items: baseline; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--neutral-soft); color: var(--ink-2); white-space: nowrap; }
  .stat b { font-weight: 500; color: var(--ink); }
  .stat.tone-hero { background: var(--accent-soft); color: var(--accent-ink); } .stat.tone-hero b { color: var(--accent-ink); }
  .stat.tone-added { background: var(--added-soft); color: var(--added); } .stat.tone-added b { color: var(--added); }
  .stat.tone-modified { background: var(--modified-soft); color: var(--modified); } .stat.tone-modified b { color: var(--modified); }
  .stat.tone-removed { background: var(--removed-soft); color: var(--removed); } .stat.tone-removed b { color: var(--removed); }

  .toolbar { top: 16px; right: 16px; display: flex; align-items: center; padding: 4px; gap: 2px; }
  .toolbar button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 7px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
  .toolbar button:hover { background: var(--hover); color: var(--ink); }
  .toolbar button.on { color: var(--accent-ink); }
  .toolbar button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar .sep { width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }

  .zoom { bottom: 16px; right: 16px; padding: 7px 11px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hint { position: absolute; left: 16px; bottom: 18px; max-width: 200px; line-height: 1.6; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* Filmstrip: the diagrams as cards along the bottom. */
  .film { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100vw - 260px); display: flex; gap: 8px; padding: 6px; overflow-x: auto; scrollbar-width: thin; }
  .film button { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 8px; border: 1px solid transparent; text-align: left; flex: 0 1 236px; min-width: 112px; }
  .film button > span:last-child { min-width: 0; }
  .film button:hover { background: var(--hover); }
  .film button.active { border-color: var(--rule); background: var(--hover); }
  .film .thumb { width: 74px; height: 46px; border-radius: 4px; overflow: hidden; flex: none; border: 1px solid var(--rule); background: var(--stage-bg); }
  .film .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .film .t { font-size: 13.5px; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .film button.active .t { color: var(--ink); }
  .film .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted); margin-top: 2px; }

  /* The tour: a column of steps down the left, the current one lit, over a soft fade. */
  .tour { position: absolute; left: 0; top: 0; bottom: 0; width: min(480px, 38vw); pointer-events: none;
          background: linear-gradient(90deg, var(--stage-bg) 0%, color-mix(in srgb, var(--stage-bg) 88%, transparent) 62%, transparent 100%); }
  .tour ol { list-style: none; margin: 0; padding: 0; position: absolute; left: 40px; right: 36px; top: 50%; transition: transform .55s cubic-bezier(.4,0,.2,1); }
  .tour li { padding: 16px 0; opacity: .32; transition: opacity .35s; pointer-events: auto; }
  .tour li.active { opacity: 1; }
  .tour li button { text-align: left; width: 100%; display: grid; gap: 6px; }
  .tour .n { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--accent-ink); display: none; }
  .tour li.active .n { display: block; }
  .tour .h { font-family: var(--display); font-size: 22px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .tour li.active .h { font-size: 30px; }
  .tour .b { font-size: 16px; line-height: 1.5; color: var(--ink-2); display: none; max-width: 40ch; }
  .tour li.active .b { display: block; }
  .tour .transport { position: absolute; left: 40px; bottom: 18px; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
  .tour .transport button { width: 34px; height: 30px; border: 1px solid var(--rule); border-radius: 6px; display: grid; place-items: center; background: var(--panel); color: var(--ink-2); }
  .tour .transport button:hover { background: var(--hover); }
  .tour .transport button svg { width: 13px; height: 13px; fill: currentColor; }
  .tour .transport .play { width: 44px; background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
  .tour .transport .leave { margin-left: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tour .bar { position: absolute; left: 0; top: 0; width: 3px; height: 0; background: var(--accent); }

  .detail { top: 76px; right: 16px; width: min(340px, calc(100vw - 32px)); padding: 12px 14px 14px; display: grid; gap: 6px; }
  .detail .kind { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .detail .delta { padding: 1px 7px; border-radius: 999px; font-size: 10.5px; }
  .detail .delta.added { background: var(--added-soft); color: var(--added); }
  .detail .delta.modified { background: var(--modified-soft); color: var(--modified); }
  .detail .delta.removed { background: var(--removed-soft); color: var(--removed); }
  .detail .delta.unchanged { background: var(--neutral-soft); color: var(--muted); }
  .detail .label { font-weight: 600; font-size: 15px; }
  .detail .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .detail .sum { font-size: 13px; color: var(--ink-2); }
  .detail .files { display: grid; gap: 2px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
  .detail .files a { color: inherit; text-decoration: none; }
  .detail .files a:hover { color: var(--focus); text-decoration: underline; }
  .detail .close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 4px; color: var(--muted); display: grid; place-items: center; }
  .detail .close:hover { background: var(--hover); }

  @media (max-width: 860px) {
    .titlecard .stats { display: none; }
    .toolbar button span { display: none; }
    .film { max-width: calc(100vw - 32px); }
    .tour { width: 100%; top: auto; height: 46%; background: linear-gradient(0deg, var(--stage-bg) 0%, color-mix(in srgb, var(--stage-bg) 88%, transparent) 70%, transparent 100%); }
    .tour ol { left: 20px; right: 20px; }
    .tour li.active .h { font-size: 22px; }
    .tour .transport { left: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .tour ol, .tour li { transition: none; } }
</style>

<div class="wrap" id="wrap">
  <div class="stage" id="stage" role="img" aria-label="Diagram"></div>

  <div class="float titlecard" id="titlecard">
    <h1 id="title"></h1>
    <div class="crumb" id="crumb"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="float toolbar" id="toolbar">
    <button id="play-top" title="Play the walkthrough (W)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg><span>Play</span></button>
    <span class="sep"></span>
    <button id="all" title="Every diagram on one canvas (A)"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>All</span></button>
    <button id="fit" title="Fit (F)"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg><span>Fit</span></button>
    <button id="full" title="Fullscreen" hidden><svg viewBox="0 0 16 16"><path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5"/></svg><span>Fullscreen</span></button>
  </div>

  <nav class="float film" id="film" aria-label="Diagrams"></nav>
  <div class="float zoom" id="zoom">100%</div>
  <div class="hint" id="hint">W play · A all · F fit<br>click a card for its files</div>

  <aside class="tour" id="tour" hidden>
    <div class="bar" id="bar"></div>
    <ol id="steps"></ol>
    <div class="transport">
      <button id="prev" title="Previous step (←)" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M11 2 4 8l7 6z"/></svg></button>
      <button id="play" class="play" title="Pause (W)" aria-label="Pause"><svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
      <button id="next" title="Next step (→)" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M5 2l7 6-7 6z"/></svg></button>
      <span class="leave">Esc to leave</span>
    </div>
  </aside>

  <div class="float detail" id="detail" hidden></div>
</div>

<script>__RENDERER__</script>
<script id="doc" type="application/json">__DOC__</script>
<script>
(function () {
  "use strict";
  var doc = JSON.parse(document.getElementById("doc").textContent);
  var render = PrLens.render, flattenViews = PrLens.flattenViews, findView = PrLens.findView, paletteFor = PrLens.paletteFor;
  var $ = function (id) { return document.getElementById(id); };
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var HOLD_MS = 4000, TWEEN_MS = reduced ? 0 : 650, PAD = 56, MIN_ZOOM_SHARE = 0.42, GRID_GAP = 160;

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function theme() {
    var s = document.documentElement.getAttribute("data-theme");
    if (s === "dark" || s === "light") return s;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  // ---- document shape ------------------------------------------------------
  var plan = PrLens.planWalkthrough(doc), views = plan.views, flowViewFor = plan.flowViewFor;

  // Every diagram the document carries, in reading order: views (nested), a bare lens, uncovered flows.
  var diagrams = [];
  (function collect() {
    var covered = {};
    function walk(v) {
      diagrams.push({ key: "view:" + v.id, title: v.title, lens: v.lens });
      if (v.lens === "data-flow" && v.scope.kind === "selection") v.scope.flows.forEach(function (f) { covered[f] = true; });
      v.children.forEach(walk);
    }
    doc.views.forEach(walk);
    if (!doc.views.length && (doc.lenses || []).indexOf("architecture") !== -1 && doc.nodes.length) diagrams.push({ key: "lens:architecture", title: doc.title, lens: "architecture" });
    doc.flows.forEach(function (f) { if (!covered[f.id]) diagrams.push({ key: "flow:" + f.id, title: f.title, lens: "data-flow" }); });
  })();

  var cache = {};
  function rendered(key) {
    var t = theme(), ck = key + "|" + t;
    if (cache[ck]) return cache[ck];
    var out;
    if (key.indexOf("view:") === 0) {
      var id = key.slice(5), v = findView(doc.views, id);
      out = render(doc, { lens: v.lens, theme: t, view: id });
    } else if (key.indexOf("flow:") === 0) {
      var fid = key.slice(5), vid = flowViewFor[fid];
      if (vid) out = render(doc, { lens: "data-flow", theme: t, view: vid });
      else {
        var flow = doc.flows.filter(function (f) { return f.id === fid; })[0];
        var only = { id: "__flow", title: flow.title, lens: "data-flow", summary: "", defaultOpen: false, children: [], scope: { kind: "selection", lanes: [], nodes: [], edges: [], flows: [fid] } };
        out = render(Object.assign({}, doc, { views: [only] }), { lens: "data-flow", theme: t, view: "__flow" });
      }
    } else {
      out = render(doc, { lens: key.slice(5), theme: t });
    }
    cache[ck] = out;
    return out;
  }
  // ---- header -------------------------------------------------------------
  (function header() {
    var p = doc.provenance || {}, crumb = [];
    if (p.repo) crumb.push("<b>" + esc(p.repo.owner + "/" + p.repo.name) + "</b>");
    if (p.pullRequest) crumb.push("PR #" + esc(String(p.pullRequest.number)));
    if (p.head) crumb.push(esc(String(p.head.sha).slice(0, 7)));
    crumb.push(diagrams.length + (diagrams.length === 1 ? " diagram" : " diagrams"));
    var st = doc.stats || {};
    if (typeof st.filesChanged === "number" && typeof st.additions === "number" && typeof st.deletions === "number")
      crumb.push(st.filesChanged + " files · +" + st.additions + " / −" + st.deletions);
    $("crumb").innerHTML = crumb.join('<span aria-hidden="true">·</span>');
    $("title").textContent = doc.title;
    $("stats").innerHTML = (st.chips || []).map(function (c) {
      return '<span class="stat tone-' + esc(c.tone || "neutral") + '">' + esc(c.label) + " <b>" + esc(c.value) + "</b></span>";
    }).join("");
    if (!(st.chips || []).length) $("stats").hidden = true;
  })();

  // ---- stage + camera ------------------------------------------------------
  var stageEl = $("stage"), svgEl = null, current = null, cam = null, tween = null;
  // current = { key, r, offsets? } — offsets maps diagram key -> placement when the stage shows the grid.

  function applyCam() {
    if (!svgEl || !cam) return;
    svgEl.setAttribute("viewBox", [cam.x, cam.y, cam.w, cam.h].map(function (n) { return Math.round(n * 100) / 100; }).join(" "));
    var scale = Math.max(cam.w / Math.max(1, stageEl.clientWidth), cam.h / Math.max(1, stageEl.clientHeight));
    $("zoom").textContent = Math.round(100 / scale) + "%";
  }
  function setCam(target, animate) {
    if (tween) { cancelAnimationFrame(tween.raf); tween = null; }
    if (!animate || !cam || TWEEN_MS === 0) { cam = target; applyCam(); return; }
    var from = cam, start = performance.now();
    var step = function (now) {
      var k = Math.min(1, (now - start) / TWEEN_MS), e = 1 - Math.pow(1 - k, 3);
      cam = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, w: from.w + (target.w - from.w) * e, h: from.h + (target.h - from.h) * e };
      applyCam();
      if (k < 1) tween.raf = requestAnimationFrame(step); else tween = null;
    };
    tween = { raf: requestAnimationFrame(step) };
  }
  function union(boxes) {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    boxes.forEach(function (b) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); });
    return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
  }
  // What the floating chrome covers, in px, so a fit lands the subject in the clear.
  function insets() {
    var W = stageEl.clientWidth, H = stageEl.clientHeight, tour = !$("tour").hidden;
    var top = $("titlecard").offsetHeight + 28;
    var left = tour ? Math.min(480, W * 0.38) : 16;
    var bottom = tour ? 72 : ($("film").hidden ? 16 : $("film").offsetHeight + 32);
    return { top: top, left: left, bottom: bottom, right: 16, W: W, H: H };
  }
  function cameraFor(r, boxes) {
    var i = insets(), uw = Math.max(1, i.W - i.left - i.right), uh = Math.max(1, i.H - i.top - i.bottom), aspect = uw / uh;
    var b = boxes.length ? union(boxes) : { x: 0, y: 0, width: r.width, height: r.height };
    var pad = boxes.length ? PAD : 24;
    b = { x: b.x - pad, y: b.y - pad, width: b.width + 2 * pad, height: b.height + 2 * pad };
    var minW = r.width * MIN_ZOOM_SHARE;
    if (boxes.length && b.width < minW) { b.x -= (minW - b.width) / 2; b.width = minW; }
    if (b.width / b.height > aspect) { var h = b.width / aspect; b.y -= (h - b.height) / 2; b.height = h; }
    else { var w = b.height * aspect; b.x -= (w - b.width) / 2; b.width = w; }
    var upp = b.width / uw; // diagram units per px
    return { x: b.x - i.left * upp, y: b.y - i.top * upp, w: b.width + (i.left + i.right) * upp, h: b.height + (i.top + i.bottom) * upp };
  }
  function mount(svg) {
    stageEl.innerHTML = svg;
    svgEl = stageEl.querySelector("svg");
    svgEl.removeAttribute("width"); svgEl.removeAttribute("height");
    svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
  }
  function showDiagram(key, opts) {
    opts = opts || {};
    var r = rendered(key);
    mount(r.svg);
    current = { key: key, r: r };
    $("all").classList.remove("on");
    if (opts.keepCamera && cam) applyCam(); else setCam(cameraFor(r, []), false);
    markFilm(key);
    if (!opts.keepCamera) hideDetail();
  }

  // Every diagram side by side on one canvas, each under its name.
  function showAll(opts) {
    opts = opts || {};
    var pal = paletteFor(theme()), x = 0, parts = [], offsets = {}, maxH = 0;
    var totalW = diagrams.reduce(function (s, d) { return s + rendered(d.key).width + GRID_GAP; }, -GRID_GAP);
    var fs = Math.max(26, Math.round(totalW / 130)), labelH = Math.round(fs * 2.4);
    diagrams.forEach(function (d) {
      var r = rendered(d.key);
      var inner = r.svg.replace(/^<svg[^>]*>/, '<svg x="' + x + '" y="' + labelH + '" width="' + r.width + '" height="' + r.height + '" viewBox="0 0 ' + r.width + " " + r.height + '">');
      var label = '<text x="' + x + '" y="' + Math.round(labelH * 0.62) + '" font-size="' + fs + '" font-weight="600" fill="' + pal.foreground + '" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">' + esc(d.title) +
        '<tspan dx="' + Math.round(fs * 0.6) + '" font-size="' + Math.round(fs * 0.7) + '" font-weight="400" fill="' + pal.muted + '" font-family="ui-monospace, Menlo, monospace">' + (d.lens === "data-flow" ? "data flow" : "architecture") + "</tspan></text>";
      parts.push(label + inner);
      offsets[d.key] = { dx: x, dy: labelH, width: r.width, height: r.height };
      maxH = Math.max(maxH, r.height);
      x += r.width + GRID_GAP;
    });
    var W = x - GRID_GAP, H = labelH + maxH;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '"><title>' + esc(doc.title) + "</title>" + parts.join("") + "</svg>";
    mount(svg);
    current = { key: "all", r: { width: W, height: H, atlas: { lanes: {}, nodes: {}, edges: {}, messages: {} } }, offsets: offsets };
    $("all").classList.add("on");
    if (opts.keepCamera && cam) applyCam(); else setCam(cameraFor(current.r, []), false);
    markFilm(null);
    if (!opts.keepCamera) hideDetail();
  }

  // ---- veil ---------------------------------------------------------------
  var SVG_NS = "http://www.w3.org/2000/svg";
  function el(name, attrs) { var e = document.createElementNS(SVG_NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function setVeil(boxes) {
    if (!svgEl) return;
    var old = svgEl.querySelector("#lens-veil"); if (old) old.remove();
    if (!boxes.length) return;
    var pal = paletteFor(theme()), r = current.r, u = union(boxes), m = 18;
    var region = { x: u.x - m, y: u.y - m, width: u.width + 2 * m, height: u.height + 2 * m };
    var g = el("g", { id: "lens-veil", "pointer-events": "none" });
    var mask = el("mask", { id: "lens-veil-mask", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: r.width, height: r.height });
    mask.appendChild(el("rect", { x: 0, y: 0, width: r.width, height: r.height, fill: "#fff" }));
    mask.appendChild(el("rect", { x: region.x, y: region.y, width: region.width, height: region.height, rx: 14, fill: "#000" }));
    g.appendChild(mask);
    g.appendChild(el("rect", { x: 0, y: 0, width: r.width, height: r.height, fill: pal.background, "fill-opacity": ".78", mask: "url(#lens-veil-mask)" }));
    g.appendChild(el("rect", { x: region.x, y: region.y, width: region.width, height: region.height, rx: 14, fill: "none", stroke: pal.muted, "stroke-width": 1.5, "stroke-opacity": ".75" }));
    svgEl.appendChild(g);
  }

  // ---- filmstrip -----------------------------------------------------------
  function buildFilm() {
    var film = $("film");
    diagrams.forEach(function (d) {
      var b = document.createElement("button");
      b.dataset.key = d.key; b.title = d.title;
      b.innerHTML = '<span class="thumb"><img alt=""></span><span><div class="t">' + esc(d.title) + '</div><div class="l">' + (d.lens === "data-flow" ? "data flow" : "architecture") + "</div></span>";
      b.addEventListener("click", function () { leaveTour(); showDiagram(d.key); });
      film.appendChild(b);
    });
    refreshThumbs();
  }
  function refreshThumbs() {
    var cards = $("film").querySelectorAll("button");
    for (var i = 0; i < cards.length; i++) cards[i].querySelector("img").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(rendered(cards[i].dataset.key).svg);
  }
  function markFilm(key) {
    var items = $("film").querySelectorAll("button");
    for (var i = 0; i < items.length; i++) {
      var on = items[i].dataset.key === key;
      items[i].classList.toggle("active", on);
      if (on && items[i].scrollIntoView) items[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  // ---- walkthrough --------------------------------------------------------
  var resolved = plan.steps, stepIndex = -1, playing = false, timer = null;
  function focusBoxes(r, s) {
    var f = s.step.focus;
    if (!f || f.kind !== "selection") return [];
    var a = r.atlas, out = [];
    (f.lanes || []).forEach(function (id) { if (a.lanes[id]) out.push(a.lanes[id]); });
    (f.nodes || []).forEach(function (id) { if (a.nodes[id]) out.push(a.nodes[id]); });
    (f.edges || []).forEach(function (id) { if (a.edges[id]) out.push(a.edges[id]); });
    (f.messages || []).forEach(function (id) {
      if (s.stage && s.stage.kind === "flow") { var m = a.messages[s.stage.flow]; if (m && m[id]) out.push(m[id]); return; }
      for (var fid in a.messages) if (a.messages[fid][id]) { out.push(a.messages[fid][id]); return; }
    });
    return out;
  }
  function enterTour() {
    $("tour").hidden = false; $("film").hidden = true; $("hint").hidden = true; $("play-top").hidden = true; $("titlecard").classList.add("compact");
  }
  function gotoStep(i, opts) {
    opts = opts || {};
    if (!resolved.length) return;
    i = (i + resolved.length) % resolved.length;
    var s = resolved[i], key = s.key || (current && current.key !== "all" && current.key) || firstKey;
    enterTour(); // before the camera is computed, so the fit allows for the step column
    var switched = !current || current.key !== key;
    if (switched) showDiagram(key, { keepCamera: false });
    var boxes = focusBoxes(current.r, s);
    setCam(cameraFor(current.r, boxes), !switched && !opts.instant);
    setVeil(boxes);
    stepIndex = i;
    var lis = $("steps").children;
    for (var k = 0; k < lis.length; k++) lis[k].classList.toggle("active", k === i);
    centreStep(i);
    runBar();
  }
  function centreStep(i) {
    var ol = $("steps"), li = ol.children[i]; if (!li) return;
    ol.style.transform = "translateY(" + (-(li.offsetTop + li.offsetHeight / 2)) + "px)";
  }
  function runBar() {
    var bar = $("bar");
    bar.style.transition = "none"; bar.style.height = "0";
    void bar.offsetHeight;
    if (!playing) return;
    bar.style.transition = "height " + HOLD_MS + "ms linear"; bar.style.height = "100%";
  }
  function play() {
    if (!resolved.length) return;
    playing = true; setPlayIcon();
    if (stepIndex < 0 || stepIndex >= resolved.length - 1) gotoStep(0); else runBar();
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!playing) return;
      if (stepIndex >= resolved.length - 1) { pause(); return; }
      gotoStep(stepIndex + 1); schedule();
    }, HOLD_MS);
  }
  function pause() { playing = false; clearTimeout(timer); setPlayIcon(); runBar(); }
  function setPlayIcon() {
    $("play").innerHTML = playing ? '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
    $("play").setAttribute("aria-label", playing ? "Pause" : "Play"); $("play").title = playing ? "Pause (W)" : "Play (W)";
  }
  function leaveTour() {
    pause(); stepIndex = -1;
    $("tour").hidden = true; $("film").hidden = false; $("hint").hidden = false; $("play-top").hidden = !resolved.length; $("titlecard").classList.remove("compact");
    setVeil([]);
    var lis = $("steps").children; for (var k = 0; k < lis.length; k++) lis[k].classList.remove("active");
  }
  if (resolved.length) {
    var ol = $("steps");
    resolved.forEach(function (s, i) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.innerHTML = '<span class="n">' + String(i + 1).padStart(2, "0") + " / " + String(resolved.length).padStart(2, "0") + '</span><span class="h">' + esc(s.step.heading) + '</span><span class="b">' + esc(s.step.body) + "</span>";
      b.addEventListener("click", function () { pause(); gotoStep(i); });
      li.appendChild(b); ol.appendChild(li);
    });
    $("play").addEventListener("click", function () { playing ? pause() : play(); });
    $("play-top").addEventListener("click", function () { play(); });
    $("prev").addEventListener("click", function () { pause(); gotoStep(stepIndex < 0 ? 0 : stepIndex - 1); });
    $("next").addEventListener("click", function () { pause(); gotoStep(stepIndex < 0 ? 0 : stepIndex + 1); });
  } else {
    $("play-top").hidden = true;
  }

  // ---- pan / zoom / click ------------------------------------------------
  function toDiagram(clientX, clientY) {
    var rect = stageEl.getBoundingClientRect();
    var scale = Math.max(cam.w / rect.width, cam.h / rect.height);
    var vw = rect.width * scale, vh = rect.height * scale;
    var ox = cam.x - (vw - cam.w) / 2, oy = cam.y - (vh - cam.h) / 2;
    return { x: ox + (clientX - rect.left) * scale, y: oy + (clientY - rect.top) * scale, scale: scale };
  }
  var drag = null;
  stageEl.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !cam) return;
    drag = { x: e.clientX, y: e.clientY, cam: cam, moved: false }; stageEl.setPointerCapture(e.pointerId);
  });
  stageEl.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    drag.moved = true; stageEl.classList.add("dragging");
    var s = toDiagram(0, 0).scale;
    if (tween) { cancelAnimationFrame(tween.raf); tween = null; }
    cam = { x: drag.cam.x - dx * s, y: drag.cam.y - dy * s, w: drag.cam.w, h: drag.cam.h }; applyCam();
  });
  stageEl.addEventListener("pointerup", function (e) {
    var wasDrag = drag && drag.moved; drag = null; stageEl.classList.remove("dragging");
    if (e.button === 0 && !wasDrag && cam) hitTest(e.clientX, e.clientY);
  });
  stageEl.addEventListener("pointercancel", function () { drag = null; stageEl.classList.remove("dragging"); });
  stageEl.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (!cam) return;
    var p = toDiagram(e.clientX, e.clientY), f = Math.exp(e.deltaY * 0.0015);
    f = Math.min(Math.max(f, 0.5), 2);
    var maxW = Math.max(current.r.width * 4, cameraFor(current.r, []).w);
    var nw = Math.min(Math.max(cam.w * f, 120), maxW), k = nw / cam.w;
    if (tween) { cancelAnimationFrame(tween.raf); tween = null; }
    cam = { x: p.x - (p.x - cam.x) * k, y: p.y - (p.y - cam.y) * k, w: cam.w * k, h: cam.h * k }; applyCam();
  }, { passive: false });
  function fit() { if (current) setCam(cameraFor(current.r, []), true); }
  $("fit").addEventListener("click", fit);
  $("all").addEventListener("click", function () { leaveTour(); if (current && current.key === "all") showDiagram(firstKey); else showAll(); });
  if (document.fullscreenEnabled) {
    $("full").hidden = false;
    $("full").addEventListener("click", function () { document.fullscreenElement ? document.exitFullscreen() : $("wrap").requestFullscreen(); });
  }

  function hitTest(clientX, clientY) {
    if (!current) return;
    var p = toDiagram(clientX, clientY), hit = null;
    var inside = function (b, dx, dy) { return p.x >= b.x + dx && p.x <= b.x + dx + b.width && p.y >= b.y + dy && p.y <= b.y + dy + b.height; };
    if (current.key === "all") {
      // On the grid, a click on a diagram opens it.
      for (var key in current.offsets) { var o = current.offsets[key]; if (inside({ x: 0, y: 0, width: o.width, height: o.height }, o.dx, o.dy)) { showDiagram(key); return; } }
      return;
    }
    var a = current.r.atlas;
    for (var id in a.nodes) if (inside(a.nodes[id], 0, 0)) { hit = { kind: "node", id: id, box: a.nodes[id] }; break; }
    if (!hit) outer: for (var fid in a.messages) for (var mid in a.messages[fid]) if (inside(a.messages[fid][mid], 0, 0)) { hit = { kind: "message", flow: fid, id: mid, box: a.messages[fid][mid] }; break outer; }
    if (!hit) { hideDetail(); return; }
    showDetail(hit);
  }
  var lastHit = null;
  function showDetail(hit) {
    lastHit = hit;
    var d = $("detail"), html = '<button class="close" aria-label="Close">×</button>';
    if (hit.kind === "node") {
      var n = doc.nodes.filter(function (x) { return x.id === hit.id; })[0]; if (!n) return;
      html += '<div class="kind">' + esc(n.kind) + '<span class="delta ' + esc(n.delta) + '">' + esc(n.delta) + "</span></div>";
      html += '<div class="label">' + esc(n.label) + "</div>";
      if (n.subtitle) html += '<div class="sub">' + esc(n.subtitle) + "</div>";
      if (n.summary) html += '<div class="sum">' + esc(n.summary) + "</div>";
      if (n.files && n.files.length) html += '<div class="files">' + n.files.map(function (f) {
        var label = f.path + (f.startLine ? ":" + f.startLine + (f.endLine ? "–" + f.endLine : "") : "");
        var p = doc.provenance || {}, repo = p.repo, revision = f.revision === "base" ? p.base : p.head, sha = revision && revision.sha;
        if (!repo || !repo.owner || !repo.name || !sha || !/^[A-Za-z0-9.-]+(?::[0-9]+)?$/.test(repo.host || "github.com")) return esc(label);
        var path = f.path.split("/").map(encodeURIComponent).join("/");
        var url = "https://" + (repo.host || "github.com") + "/" + encodeURIComponent(repo.owner) + "/" + encodeURIComponent(repo.name) + "/blob/" + encodeURIComponent(sha) + "/" + path;
        if (f.startLine) url += "#L" + f.startLine + (f.endLine ? "-L" + f.endLine : "");
        return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + "</a>";
      }).join("<br>") + "</div>";
    } else {
      var fl = doc.flows.filter(function (x) { return x.id === hit.flow; })[0]; var m = fl && fl.messages.filter(function (x) { return x.id === hit.id; })[0]; if (!m) return;
      html += '<div class="kind">' + esc(m.kind) + " step" + '<span class="delta ' + esc(m.delta) + '">' + esc(m.delta) + "</span></div>";
      html += '<div class="label">' + esc(m.label || m.id) + "</div>";
      html += '<div class="sub">' + esc(m.from) + " → " + esc(m.to) + (m.repeat ? " · ×" + m.repeat : "") + "</div>";
    }
    d.innerHTML = html; d.hidden = false;
    d.querySelector(".close").addEventListener("click", hideDetail);
    setHitRim(hit.box);
  }
  function hideDetail() { lastHit = null; $("detail").hidden = true; setHitRim(null); }
  function setHitRim(box) {
    if (!svgEl) return;
    var old = svgEl.querySelector("#lens-hit"); if (old) old.remove();
    if (!box) return;
    svgEl.appendChild(el("rect", { id: "lens-hit", x: box.x - 6, y: box.y - 6, width: box.width + 12, height: box.height + 12, rx: 8, fill: "none", stroke: "#2c6fd1", "stroke-width": 2.5, "stroke-dasharray": "6 4", "pointer-events": "none" }));
  }

  // ---- keyboard -----------------------------------------------------------
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, onButton = !!(e.target && e.target.closest && e.target.closest("button"));
    if (onButton && (k === " " || k === "Enter")) return;
    if ((k === "w" || k === "W" || k === " ") && resolved.length) { e.preventDefault(); playing ? pause() : play(); }
    else if (k === "ArrowRight" && resolved.length) { e.preventDefault(); pause(); gotoStep(stepIndex < 0 ? 0 : stepIndex + 1); }
    else if (k === "ArrowLeft" && resolved.length) { e.preventDefault(); pause(); gotoStep(stepIndex < 0 ? 0 : stepIndex - 1); }
    else if (k === "Escape") { if (!$("detail").hidden) hideDetail(); else if (!$("tour").hidden) { leaveTour(); fit(); } }
    else if (k === "f" || k === "F") fit();
    else if (k === "a" || k === "A") $("all").click();
  });

  // ---- theme + resize ---------------------------------------------------------
  function rethem() {
    if (!current) return;
    if (current.key === "all") showAll({ keepCamera: true }); else showDiagram(current.key, { keepCamera: true });
    if (stepIndex >= 0) setVeil(focusBoxes(current.r, resolved[stepIndex]));
    if (lastHit) setHitRim(lastHit.box);
    refreshThumbs();
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rethem);
  new MutationObserver(rethem).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!current) return;
      if (stepIndex >= 0) gotoStep(stepIndex, { instant: true }); else setCam(cameraFor(current.r, []), false);
    }, 120);
  });

  // ---- boot ---------------------------------------------------------------
  var firstKey = plan.firstKey;
  buildFilm();
  if (firstKey) showDiagram(firstKey);
})();
</script>
